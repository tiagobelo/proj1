# Páginas "Mais vendidos" da Amazon.com.br que serão coletadas pelo scraper.
#
# Cada categoria tem:
#   slug:   identificador interno (usado em --category e salvo no banco)
#   name:   nome de exibição
#   url:    URL da página "Mais vendidos" do departamento
#   active: true/false — controla se `python -m scraper.amazon_scraper`
#           (sem --category) inclui essa categoria na coleta.
#
# Para "inativar" uma categoria, basta trocar seu `active` para `false`
# aqui — nenhuma mudança de código é necessária. Uma categoria inativa
# ainda pode ser coletada isoladamente com `--category <slug>`.
#
# Categorias com `active: false` e `url: ""` são departamentos que a
# Amazon.com.br lista em "Mais vendidos" (menu "Qualquer departamento")
# mas cuja URL real ainda não foi confirmada — os slugs de URL da Amazon
# não seguem um padrão previsível a partir do nome em português (ex.:
# "Ferramentas" usa /hi/, não /tools/), então é preciso abrir cada link
# no site e copiar a URL antes de ativar. Ao confirmar, preencha `url` e
# troque `active` para `true`.

categories:
  # --- Verificadas (URL confirmada, coleta ativa) ---
  - slug: eletronicos
    name: Eletrônicos
    url: https://www.amazon.com.br/gp/bestsellers/electronics/
    active: true

  - slug: informatica
    name: Computadores e Informática
    url: https://www.amazon.com.br/gp/bestsellers/computers/
    active: true

  - slug: casa
    name: Casa
    url: https://www.amazon.com.br/gp/bestsellers/home/
    active: true

  - slug: ferramentas
    name: Ferramentas e Materiais de Construção
    url: https://www.amazon.com.br/gp/bestsellers/hi/
    active: true

  - slug: acessorios-celular
    name: Acessórios para celular
