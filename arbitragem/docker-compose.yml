services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arbitragem
      POSTGRES_PASSWORD: arbitragem
      POSTGRES_DB: arbitragem
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  postgres_data:
